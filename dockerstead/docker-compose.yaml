name: dockerstead

x-php-common: &php-common
  volumes:
    - ${CODE_PATH:-D:/Code}:/home/vagrant/code
  environment:
    DB_HOST: mysql
    DB_DATABASE: ${MYSQL_DATABASE:-homestead}
    DB_USERNAME: ${MYSQL_USER:-homestead}
    DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
    REDIS_HOST: redis
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
  networks: [dockerstead]
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "php -v >/dev/null"]
    interval: 20s
    timeout: 5s
    retries: 3

x-frankenphp-common: &frankenphp-common
  volumes:
    - ${CODE_PATH:-D:/Code}:/home/vagrant/code
  environment:
    DB_HOST: mysql
    DB_DATABASE: ${MYSQL_DATABASE:-homestead}
    DB_USERNAME: ${MYSQL_USER:-homestead}
    DB_PASSWORD: ${MYSQL_PASSWORD:-secret}
    REDIS_HOST: redis
    MAIL_HOST: mailpit
    MAIL_PORT: 1025
    FRANKENPHP_ROOT: ${FRANKENPHP_ROOT:-/home/vagrant/code}
  networks: [dockerstead]
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "php -v >/dev/null"]
    interval: 20s
    timeout: 5s
    retries: 3

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: dockerstead_nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ${CODE_PATH:-D:/Code}:/home/vagrant/code:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ${CERT_PATH:-../.certificates}:/etc/nginx/certs:ro
    depends_on:
      php74: { condition: service_healthy }
      php80: { condition: service_healthy }
      php81: { condition: service_healthy }
      php82: { condition: service_healthy }
      php83: { condition: service_healthy }
      php84: { condition: service_healthy }
      php85: { condition: service_healthy }
    networks: [dockerstead]
    restart: unless-stopped

  php74:
    <<: *php-common
    image: dockerstead/php:7.4
    build: { context: ., dockerfile: Dockerfile, args: { PHP_VERSION: "7.4" } }
    container_name: dockerstead_php74
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
  php80:
    <<: *php-common
    image: dockerstead/php:8.0
    build: { context: ., dockerfile: Dockerfile, args: { PHP_VERSION: "8.0" } }
    container_name: dockerstead_php80
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
  php81:
    <<: *php-common
    image: dockerstead/php:8.1
    build: { context: ., dockerfile: Dockerfile, args: { PHP_VERSION: "8.1" } }
    container_name: dockerstead_php81
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
  php82:
    <<: *php-common
    image: dockerstead/php:8.2
    build: { context: ., dockerfile: Dockerfile, args: { PHP_VERSION: "8.2" } }
    container_name: dockerstead_php82
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
  php83:
    <<: *php-common
    image: dockerstead/php:8.3
    build: { context: ., dockerfile: Dockerfile, args: { PHP_VERSION: "8.3" } }
    container_name: dockerstead_php83
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
  php84:
    <<: *php-common
    image: dockerstead/php:8.4
    build: { context: ., dockerfile: Dockerfile, args: { PHP_VERSION: "8.4" } }
    container_name: dockerstead_php84
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
  php85:
    <<: *php-common
    image: dockerstead/php:8.5
    build: { context: ., dockerfile: Dockerfile, args: { PHP_VERSION: "8.5" } }
    container_name: dockerstead_php85
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }

  frankenphp82:
    <<: *frankenphp-common
    image: dockerstead/frankenphp:8.2
    build: { context: ., dockerfile: Frankenfile, args: { PHP_VERSION: "8.2" } }
    container_name: dockerstead_frankenphp82
    ports: ["${FRANKENPHP82_PORT:-8082}:80"]
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
  frankenphp83:
    <<: *frankenphp-common
    image: dockerstead/frankenphp:8.3
    build: { context: ., dockerfile: Frankenfile, args: { PHP_VERSION: "8.3" } }
    container_name: dockerstead_frankenphp83
    ports: ["${FRANKENPHP83_PORT:-8083}:80"]
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
  frankenphp84:
    <<: *frankenphp-common
    image: dockerstead/frankenphp:8.4
    build: { context: ., dockerfile: Frankenfile, args: { PHP_VERSION: "8.4" } }
    container_name: dockerstead_frankenphp84
    ports: ["${FRANKENPHP84_PORT:-8084}:80"]
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
  frankenphp85:
    <<: *frankenphp-common
    image: dockerstead/frankenphp:8.5
    build: { context: ., dockerfile: Frankenfile, args: { PHP_VERSION: "8.5" } }
    container_name: dockerstead_frankenphp85
    ports: ["${FRANKENPHP85_PORT:-8085}:80"]
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }

  mysql:
    image: mysql:8.4
    container_name: dockerstead_mysql
    ports: ["${MYSQL_PORT:-3306}:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-homestead}
      MYSQL_USER: ${MYSQL_USER:-homestead}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
    volumes: [mysql_data:/var/lib/mysql]
    networks: [dockerstead]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgresql:
    image: postgres:17-alpine
    container_name: dockerstead_postgres
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-homestead}
      POSTGRES_USER: ${POSTGRES_USER:-homestead}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secret}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [dockerstead]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: dockerstead_redis
    ports: ["${REDIS_PORT:-6379}:6379"]
    networks: [dockerstead]
    restart: unless-stopped

  memcached:
    image: memcached:1.6-alpine
    container_name: dockerstead_memcached
    ports: ["${MEMCACHED_PORT:-11211}:11211"]
    networks: [dockerstead]
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.21
    container_name: dockerstead_mailpit
    ports: ["${MAILPIT_UI_PORT:-8025}:8025", "${MAILPIT_SMTP_PORT:-1025}:1025"]
    networks: [dockerstead]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: dockerstead_minio
    profiles: [optional]
    command: server /data --console-address ":9001"
    ports: ["${MINIO_API_PORT:-9000}:9000", "${MINIO_CONSOLE_PORT:-9001}:9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes: [minio_data:/data]
    networks: [dockerstead]
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.15
    container_name: dockerstead_meilisearch
    profiles: [optional]
    ports: ["${MEILISEARCH_PORT:-7700}:7700"]
    environment:
      MEILI_MASTER_KEY: "${MEILI_MASTER_KEY:-masterKey}"
    volumes: [meilisearch_data:/meili_data]
    networks: [dockerstead]
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: dockerstead_elasticsearch
    profiles: [optional]
    ports: ["${ELASTICSEARCH_HTTP_PORT:-9200}:9200"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: [elasticsearch_data:/usr/share/elasticsearch/data]
    networks: [dockerstead]
    restart: unless-stopped

  mongodb:
    image: mongo:8
    container_name: dockerstead_mongodb
    profiles: [optional]
    ports: ["${MONGODB_PORT:-27017}:27017"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-secret}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-homestead}
    volumes: [mongodb_data:/data/db]
    networks: [dockerstead]
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: dockerstead_adminer
    ports: ["${ADMINER_PORT:-8080}:8080"]
    depends_on: [mysql, postgresql]
    networks: [dockerstead]
    restart: unless-stopped

networks:
  dockerstead:
    name: dockerstead
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
  minio_data:
  meilisearch_data:
  elasticsearch_data:
  mongodb_data:
