server {
    listen 80 default_server;
    server_name localhost *.testing;
    root $dockerstead_root;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $dockerstead_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $dockerstead_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $dockerstead_php;
    }

    location ~* \.(?:jpg|jpeg|gif|png|webp|svg|ico|css|js|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

server {
    listen 443 ssl default_server;
    server_name localhost *.testing;
    root $dockerstead_root;
    index index.php index.html;
    ssl_certificate /etc/nginx/certs/homestead.crt;
    ssl_certificate_key /etc/nginx/certs/homestead.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $dockerstead_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $dockerstead_root;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass $dockerstead_php;
    }
}
